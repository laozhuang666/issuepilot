[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issuepilot"
version = "0.1.0"
description = "Turn a public GitHub issue into an evidence-backed implementation plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IssuePilot contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.60,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
issuepilot = "issuepilot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/issuepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

